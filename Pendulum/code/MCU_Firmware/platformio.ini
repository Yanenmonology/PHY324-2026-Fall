;Pendulum mass board sensor (MBS) firmware, ESP32-S3-WROOM-1-N8
[env:mbs]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
;FW_stage: 1-scan and init 2-odr trigger sync, selftest, 3-logging department
build_flags = -DFW_STAGE=1
[platformio]
src_dir = src